name: visionattend

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    networks: [visionattend_net]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    restart: unless-stopped
    networks: [visionattend_net]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  opencv-ai:
    build: ./opencv-ai
    restart: unless-stopped
    networks: [visionattend_net]
    ports:
      - "10000:10000"

    # ✅ CHANGE 1: env_file use karo
    env_file:
      - ./opencv-ai/.env

    environment:
      PORT: 10000
      OPENCV_API_KEY: visionattend-opencv-2026secure
      MONGO_CONNECT_RETRIES: 20
      MONGO_CONNECT_DELAY_MS: 2000

    depends_on:
      - mongo

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/health')"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  backend:
    build: ./backend
    restart: unless-stopped
    networks: [visionattend_net]
    ports:
      - "5000:5000"

    # ✅ CHANGE 2: env_file use karo
    env_file:
      - ./backend/.env

    environment:
      PORT: 5000
      JWT_SECRET: visionattend-dev-secret
      FRONTEND_URL: http://localhost:3000
      FRONTEND_URLS: http://localhost:3000,http://127.0.0.1:3000
      OPENCV_VERIFY_URL: http://opencv-ai:10000/verify
      OPENCV_REGISTER_URL: http://opencv-ai:10000/register
      OPENCV_API_KEY: visionattend-opencv-2026secure
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEV_MODE: "false"
      ALLOW_STUDENT_MANUAL_BYPASS: "false"
      AUTO_SEED_LOCAL_USERS: "true"
      DEMO_USER_PASSWORD: Vision@123

    depends_on:
      - mongo
      - redis
      - opencv-ai

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [visionattend_net]
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
      NEXT_PUBLIC_DEV_BYPASS: "false"
      NEXT_PUBLIC_DEV_MODE: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:

networks:
  visionattend_net:
    driver: bridge